[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fmeda-workbook-text-editor"
version = "0.1.0"
description = "Source-safe FMEDA workbook to reviewable text and Markdown Editor workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1.2",
  "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fmeda-workspace = "mfmt.fmeda_cli:main"
fmeda-patch = "mfmt.fmeda_patch_cli:main"
fmeda-validate = "mfmt.fmeda_validate_cli:main"

[tool.setuptools.packages.find]
include = ["mfmt*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
